name: CI/CD

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run Ruff formatter check
        run: ruff format --check src tests

      - name: Run Mypy type checker
        run: mypy src

  security:
    name: Security (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan secrets with Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source="/repo" --verbose --redact

  tests:
    name: Tests & Coverage (>= 80%)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
          POSTGRES_DB: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U biblioteca -d biblioteca"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://biblioteca:biblioteca@localhost:5432/biblioteca
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run unit and integration tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  contract:
    name: Contract (OpenAPI Spectral)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if OpenAPI spec exists
        id: check_spec
        run: |
          if [ -f docs/openapi.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "docs/openapi.yaml not found yet — Spectral validation will activate once added."
          fi

      - name: Set up Node.js
        if: steps.check_spec.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate OpenAPI spec with Spectral
        if: steps.check_spec.outputs.exists == 'true'
        run: |
          if [ -f .spectral.yaml ] || [ -f .spectral.yml ]; then
            npx --yes @stoplight/spectral-cli lint docs/openapi.yaml
          else
            echo 'extends: ["spectral:oas"]' > /tmp/.spectral.yaml
            npx --yes @stoplight/spectral-cli lint --ruleset /tmp/.spectral.yaml docs/openapi.yaml
          fi

  docker-verify:
    name: Docker Build & Smoke Verification
    runs-on: ubuntu-latest
    needs: [quality, security, tests, contract]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start services with Docker Compose
        run: docker compose up -d --build --wait

      - name: Verify non-root container user (appuser)
        run: |
          CONTAINER_USER=$(docker compose exec -T api id -un)
          echo "Running container user: $CONTAINER_USER"
          test "$CONTAINER_USER" = "appuser"

      - name: Verify API health endpoint
        run: curl -fsS http://localhost:8000/health

      - name: Run k6 smoke test (if present)
        run: |
          if [ -f tests/perf/smoke.js ]; then
            docker compose --profile perf run --rm --no-deps k6 run /scripts/smoke.js
          else
            echo "tests/perf/smoke.js not found yet — k6 smoke test will activate once added."
          fi

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: [docker-verify]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
